<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Springs Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0; background:#D2D5DA; display:grid; place-items:center}
.wrap{width:min(1000px, 100% - 24px); display:grid; gap:clamp(8px, 3vw, 32px); grid-template-columns:1fr 1fr}
canvas{display:block; width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"><canvas id="det"></canvas></div>
  <div role="progressbar" aria-label="Loading"><canvas id="ind"></canvas></div>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
  const ease = x => x*x*(3-2*x);
  function makeStage(canvas, aspect){
    const st = { c:canvas, ctx:canvas.getContext('2d'), w:0, h:0, dpr:1 };
    st.resize = () => {
      const w = canvas.parentElement.clientWidth; if (!w) return;
      const h = Math.round(w*aspect);
      st.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w*st.dpr); canvas.height = Math.round(h*st.dpr);
      canvas.style.height = h + 'px'; st.w = w; st.h = h;
    };
    st.begin = () => { st.ctx.setTransform(st.dpr,0,0,st.dpr,0,0); st.ctx.clearRect(0,0,st.w,st.h); };
    return st;
  }
  // determinate: irregular jumps 0 -> 100, hold, reset. p follows with a springy overshoot.
  function detDriver(){
    const d = { p:0, v:0, target:0, doneT:-1, kicks:0 };
    (async () => { while (true){
      d.target = 0; d.p = 0; d.v = 0; await wait(1500);
      let x = 0;
      while (x < 1){ x = Math.min(1, x + 0.03 + Math.random()*0.1); d.target = x; d.kicks++; await wait(320 + Math.random()*460); }
      await wait(3200);
    }})();
    d.step = (dt, t) => {
      if (reduce){ d.p = d.target; }
      else { const a = 190*(d.target - d.p) - 16*d.v; d.v += a*dt; d.p += d.v*dt; }
      const done = d.target >= 1 && d.p > 0.985;
      if (done && d.doneT < 0) d.doneT = t; if (!done && d.target < 1) d.doneT = -1;
    };
    return d;
  }
  // indeterminate: idle -> running -> completed, looping
  function indDriver(){
    const d = { run:0, phase:'idle', doneT:-1, T:0 };
    d.step = (dt, t) => {
      const T = t % 9.8; d.T = T;
      d.phase = T < 1.5 ? 'idle' : T < 7 ? 'run' : 'done';
      d.doneT = d.phase === 'done' ? T - 7 : -1;
      const tr = d.phase === 'run' ? 1 : 0;
      d.run += (tr - d.run) * (reduce ? 1 : 1 - Math.pow(0.02, dt));
    };
    return d;
  }
  function start(stages, draw){
    const ro = new ResizeObserver(() => stages.forEach(s => s.resize())); ro.observe(document.body);
    stages.forEach(s => s.resize());
    let last = performance.now(), t = 0;
    const frame = now => {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;
      if (stages.some(s => !s.w)){ stages.forEach(s => s.resize()); if (stages.some(s => !s.w)) return; }
      try { draw(dt, t); } catch(e){ console.error(e); }
    };
    requestAnimationFrame(frame);
  }
  const INK = '#151515', WIRE = '#9EA5AF';
  const WORD_A = 'LOADING', WORD_B = 'SUCCESS';
  const det = detDriver(), ind = indDriver();
  const sDet = makeStage(document.getElementById('det'), 0.86);
  const sInd = makeStage(document.getElementById('ind'), 0.86);
  const font = fs => `500 ${fs}px Inter, "Helvetica Neue", Arial, sans-serif`;
  const backOut = x => { const c = 1.6; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  // modular rows: round ends and soft blocks that butt together when compressed
  // g: [type, from, to] gradient; w in cell-heights
  const ROWS = [
    { off: 0.35, cells: [ { i:0, t:'round', w:1.3, g:['r','#FAFFE6','#D9FB6A'] },
                          { i:1, t:'block', w:1.7, g:['l','#EEFFB5','#D6FF3D'] },
                          { i:2, t:'block', w:1.0, g:['l','#CCFF00','#9FE21A'] } ] },
    { off:-0.45, cells: [ { i:3, t:'block', w:1.9, g:['l','#B9F36A','#E8FFA6'] },
                          { i:4, t:'round', w:1.35, g:['r','#F4FFD2','#CCFF00'] } ] },
    { off: 0.15, cells: [ { i:5, t:'round', w:1.25, g:['r','#FFFFFF','#E2FF8A'] },
                          { i:6, t:'block', w:1.55, g:['l','#D8FF45','#B4EE2A'] } ] },
  ];
  function zig(ctx, xa, xb, y, amp, coils){
    const len = xb - xa; if (len < 3) return;
    coils = Math.max(1, Math.min(coils, Math.floor(len/(amp*0.7 + 4))));
    ctx.beginPath(); ctx.moveTo(xa, y);
    if (amp < 0.4) ctx.lineTo(xb, y);
    else { const n = coils*2, st = len/(n + 1); for (let k=1;k<=n;k++) ctx.lineTo(xa + st*k, y + (k%2 ? -amp : amp)); ctx.lineTo(xb, y); }
    ctx.stroke();
  }
  function letter(ctx, a, b, cx, base, fs, f){
    if (f <= 0){ ctx.fillText(a, cx, base); return; }
    if (f >= 1){ ctx.fillText(b, cx, base); return; }
    const c = Math.cos(f*Math.PI), mid = base - fs*0.36;
    ctx.save(); ctx.translate(cx, mid); ctx.scale(1, Math.max(0.02, Math.abs(c))); ctx.fillText(c > 0 ? a : b, 0, base - mid); ctx.restore();
  }
  const flipAt = (doneT, i) => doneT < 0 ? 0 : clamp((doneT - 0.15 - i*0.06)/0.28, 0, 1);
  function shape(ctx, x, y, w, h, t){ ctx.beginPath(); ctx.roundRect(x, y, w, h, t === 'round' ? h/2 : h*0.1); }
  function cellFill(ctx, c, x, y, w, h){
    const [k, a, b] = c.g; let g;
    if (k === 'r'){ g = ctx.createRadialGradient(x + w*0.35, y + h*0.3, 0, x + w/2, y + h/2, Math.max(w, h)*0.75); }
    else g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, a); g.addColorStop(1, b); return g;
  }
  // s: row stretch 0 (cells touch) .. 1 (fully apart, springs straight)
  function drawRow(st, r, ri, s, fills, pops, alpha, doneT, ghost, bob){
    const { ctx, w, h } = st, H = h*0.17, gapMax = H*0.75, fs = H*0.36;
    const y = h*0.22 + ri*h*0.28 - H/2 + (bob || 0);
    const widths = r.cells.map(c => c.w*H), gap = gapMax*s;
    const total = widths.reduce((a,b)=>a+b, 0) + gap*(r.cells.length - 1);
    let x = (w - total)/2 + r.off*H;
    const xs = []; r.cells.forEach((c, j) => { xs.push(x); x += widths[j] + gap; });
    // springs sit behind the cells, attached at their centres
    ctx.strokeStyle = WIRE; ctx.lineWidth = Math.max(1.5, fs*0.09); ctx.lineJoin = 'round';
    for (let j=0;j<r.cells.length-1;j++){
      const a = xs[j] + widths[j] - H*0.06, b = xs[j+1] + H*0.06;
      if (b - a > 2) zig(ctx, a, b, y + H/2, H*0.2*Math.sqrt(Math.max(0, 1 - s*s)), 4);
    }
    r.cells.forEach((c, j) => {
      const cw = widths[j], cx = xs[j];
      if (ghost){ shape(ctx, cx, y, cw, H, c.t); ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill(); }
      const f = fills ? fills[c.i] : 1;
      if (f > 0){
        const sc = pops ? pops[c.i] : 1;
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.translate(cx + cw/2, y + H/2); ctx.scale(sc, sc); ctx.translate(-(cx + cw/2), -(y + H/2));
        shape(ctx, cx, y, cw, H, c.t);
        ctx.shadowColor = 'rgba(60,70,20,0.16)'; ctx.shadowBlur = H*0.25; ctx.shadowOffsetY = H*0.06;
        ctx.fillStyle = cellFill(ctx, c, cx, y, cw, H); ctx.fill();
        ctx.shadowColor = 'transparent';
        const hl = ctx.createLinearGradient(0, y, 0, y + H);
        hl.addColorStop(0, 'rgba(255,255,255,0.45)'); hl.addColorStop(0.5, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl; ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = f > 0 ? alpha : 0.32;
      ctx.fillStyle = INK; ctx.font = font(fs); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      letter(ctx, WORD_A[c.i], WORD_B[c.i], cx + cw/2, y + H/2 + fs*0.36, fs, flipAt(doneT, c.i));
      ctx.globalAlpha = 1;
    });
  }

  // ---- gooey rows (indeterminate): a single liquid pill that splits into jumping blocks ----
  const gmk = () => { const c = document.createElement('canvas'); return [c, c.getContext('2d', { willReadFrequently:true })]; };
  const [GM, GMC] = gmk(), [GB, GBC] = gmk(), [GT, GTC] = gmk();
  function zigAny(ctx, x1, y1, x2, y2, amp, coils){
    const len = Math.hypot(x2 - x1, y2 - y1); if (len < 3) return;
    ctx.save(); ctx.translate(x1, y1); ctx.rotate(Math.atan2(y2 - y1, x2 - x1)); zig(ctx, 0, len, 0, amp, coils); ctx.restore();
  }
  function hex(c){ const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function drawGooRow(st, r, ri, s, t, alpha, doneT){
    const { ctx, w, h, dpr } = st, H = h*0.17, gapMax = H*0.75, fs = H*0.36;
    const y0 = h*0.22 + ri*h*0.28 - H/2;
    const widths = r.cells.map(c => c.w*H), gap = gapMax*s;
    const total = widths.reduce((a,b)=>a+b, 0) + gap*(r.cells.length - 1);
    let x = (w - total)/2 + r.off*H;
    const air = clamp((s - 0.45)/0.4, 0, 1);            // only jump once the blocks have pulled apart
    const cells = r.cells.map((c, j) => {
      const jump = reduce ? 0 : -H*0.62*Math.max(0, Math.sin(t*5.2 - j*0.9 - ri*0.6))*air;
      const o = { c, x, y: y0 + jump, w: widths[j] }; x += widths[j] + gap; return o;
    });
    // springs first so the liquid covers their ends
    ctx.strokeStyle = WIRE; ctx.lineWidth = Math.max(1.5, fs*0.09); ctx.lineJoin = 'round';
    for (let j=0;j<cells.length-1;j++){
      const A = cells[j], B = cells[j+1];
      zigAny(ctx, A.x + A.w - H*0.1, A.y + H/2, B.x + H*0.1, B.y + H/2, H*0.16*Math.sqrt(Math.max(0, 1 - s*s)) + (air > 0 ? H*0.05 : 0), 4);
    }
    // liquid mask: blocks + blur + threshold = they fuse when close and stretch a neck as they separate
    const k = 0.5*dpr, Wh = Math.ceil(w*k), Hh = Math.ceil(h*k);
    GM.width = Wh; GM.height = Hh; GMC.setTransform(k,0,0,k,0,0); GMC.fillStyle = '#fff';
    for (const o of cells){ shape(GMC, o.x, o.y, o.w, H, o.c.t); GMC.fill(); }
    GB.width = Wh; GB.height = Hh; const BIG = Wh*2;
    GBC.shadowColor = '#fff'; GBC.shadowBlur = H*0.28*k; GBC.shadowOffsetX = BIG; GBC.drawImage(GM, -BIG, 0);
    const img = GBC.getImageData(0, 0, Wh, Hh), d = img.data;
    // colour: horizontal blend through each block's colours, like the reference gradient pill
    const stops = []; for (const o of cells){ stops.push({ x:(o.x + o.w*0.25)*k, c:hex(o.c.g[1]) }, { x:(o.x + o.w*0.75)*k, c:hex(o.c.g[2]) }); }
    for (let py=0; py<Hh; py++) for (let px=0; px<Wh; px++){
      const i = (py*Wh + px)*4, a = d[i+3]/255;
      const tt = clamp((a - 0.36)/0.16, 0, 1); if (tt <= 0){ d[i+3] = 0; continue; }
      let col;
      if (px <= stops[0].x) col = stops[0].c;
      else if (px >= stops[stops.length-1].x) col = stops[stops.length-1].c;
      else { let j = 0; while (px > stops[j+1].x) j++; const u = (px - stops[j].x)/(stops[j+1].x - stops[j].x); col = stops[j].c.map((v, n) => v + (stops[j+1].c[n] - v)*u); }
      const lift = clamp(1 - (py/k - (y0 - H*0.7))/(H*1.8), 0, 1)*0.0;
      d[i] = col[0] + lift; d[i+1] = col[1]; d[i+2] = col[2]; d[i+3] = tt*tt*(3 - 2*tt)*255*alpha;
    }
    GBC.putImageData(img, 0, 0);
    ctx.save(); ctx.shadowColor = 'rgba(60,70,20,0.16)'; ctx.shadowBlur = H*0.25*dpr; ctx.shadowOffsetY = H*0.06*dpr;
    ctx.drawImage(GB, 0, 0, w, h); ctx.restore();
    ctx.fillStyle = INK; ctx.font = font(fs); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = alpha;
    for (const o of cells) letter(ctx, WORD_A[o.c.i], WORD_B[o.c.i], o.x + o.w/2, o.y + H/2 + fs*0.36, fs, flipAt(doneT, o.c.i));
    ctx.globalAlpha = 1;
  }
  const dS = { rows: ROWS.map(() => ({ s:0, v:0 })) };
  const iS = { rows: ROWS.map(() => ({ s:0, v:0 })) };
  const spring = (o, target, dt, k, c) => { if (reduce){ o.s = target; return; } const a = k*(target - o.s) - c*o.v; o.v += a*dt; o.s += o.v*dt; };

  start([sDet, sInd], (dt, t) => {
    det.step(dt, t); ind.step(dt, t);

    // ---- determinate: cells pop in L-O-A-D-I-N-G; each row springs apart as it fills ----
    {
      const st = sDet; st.begin();
      const p = clamp(det.p, 0, 1), done = det.doneT >= 0, dT = done ? t - det.doneT : -1;
      if (det.target <= 0 && det.p < 0.01) dS.rows.forEach(r => { r.s = 0; r.v = 0; });
      const fills = [...Array(7).keys()].map(i => clamp(p*7 - i, 0, 1));
      const pops = fills.map(f => f <= 0 ? 0 : Math.min(1.08, 0.6 + 0.4*backOut(f)));
      ROWS.forEach((r, ri) => {
        const rowFill = r.cells.reduce((a, c) => a + fills[c.i], 0)/r.cells.length;
        spring(dS.rows[ri], done ? 1 : rowFill, dt, 120, 11);
        drawRow(st, r, ri, clamp(dS.rows[ri].s, 0, 1.1), fills, pops, 1, dT, !done, 0);
      });
      st.c.parentElement.setAttribute('aria-valuenow', Math.round(p*100));
    }

    // ---- indeterminate: each row is one liquid pill that splits into blocks, which hop, then fuse back ----
    {
      const st = sInd; st.begin();
      const run = ind.run, done = ind.phase === 'done', idle = ind.phase === 'idle', dT = ind.doneT;
      ROWS.forEach((r, ri) => {
        const ph = ((t*0.55 - ri*0.18) % 1 + 1) % 1;            // hold fused, split, hold apart, fuse
        const e = ph < 0.25 ? 0 : ph < 0.4 ? ease((ph - 0.25)/0.15) : ph < 0.8 ? 1 : ph < 0.95 ? 1 - ease((ph - 0.8)/0.15) : 0;
        const target = done ? 1 : idle ? 0 : e*run;
        spring(iS.rows[ri], target, dt, 140, 12);
        drawGooRow(st, r, ri, clamp(iS.rows[ri].s, 0, 1.1), done ? 0 : t, idle ? 0.55 : 1, dT);
      });
    }
  });
  try { document.fonts.load('500 40px Inter'); } catch(e){}
})();
</script>
</body>
</html>
