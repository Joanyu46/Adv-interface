<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bouncy Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<style>
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0; background:#262626; display:grid; place-items:center}
.wrap{width:min(820px, 100% - 40px); display:grid; gap:24px}
canvas{display:block; width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div role="progressbar" aria-label="Loading"><canvas id="ind"></canvas></div>
  <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"><canvas id="det"></canvas></div>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
  const ease = x => x*x*(3-2*x);
  function makeStage(canvas, aspect){
    const st = { c:canvas, ctx:canvas.getContext('2d'), w:0, h:0, dpr:1 };
    st.resize = () => {
      const w = canvas.parentElement.clientWidth; if (!w) return;
      const h = Math.round(w*aspect);
      st.dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w*st.dpr); canvas.height = Math.round(h*st.dpr);
      canvas.style.height = h + 'px'; st.w = w; st.h = h;
    };
    st.begin = () => { st.ctx.setTransform(st.dpr,0,0,st.dpr,0,0); st.ctx.clearRect(0,0,st.w,st.h); };
    return st;
  }
  // determinate: irregular jumps 0 -> 100, hold, reset. p follows with a springy overshoot.
  function detDriver(){
    const d = { p:0, v:0, target:0, doneT:-1, kicks:0 };
    (async () => { while (true){
      d.target = 0; d.p = 0; d.v = 0; await wait(1500);
      let x = 0;
      while (x < 1){ x = Math.min(1, x + 0.03 + Math.random()*0.1); d.target = x; d.kicks++; await wait(320 + Math.random()*460); }
      await wait(3200);
    }})();
    d.step = (dt, t) => {
      if (reduce){ d.p = d.target; }
      else { const a = 190*(d.target - d.p) - 16*d.v; d.v += a*dt; d.p += d.v*dt; }
      const done = d.target >= 1 && d.p > 0.985;
      if (done && d.doneT < 0) d.doneT = t; if (!done && d.target < 1) d.doneT = -1;
    };
    return d;
  }
  // indeterminate: idle -> running -> completed, looping
  function indDriver(){
    const d = { run:0, phase:'idle', doneT:-1, T:0 };
    d.step = (dt, t) => {
      const T = t % 9.8; d.T = T;
      d.phase = T < 1.5 ? 'idle' : T < 7 ? 'run' : 'done';
      d.doneT = d.phase === 'done' ? T - 7 : -1;
      const tr = d.phase === 'run' ? 1 : 0;
      d.run += (tr - d.run) * (reduce ? 1 : 1 - Math.pow(0.02, dt));
    };
    return d;
  }
  function start(stages, draw){
    const ro = new ResizeObserver(() => stages.forEach(s => s.resize())); ro.observe(document.body);
    stages.forEach(s => s.resize());
    let last = performance.now(), t = 0;
    const frame = now => {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;
      if (stages.some(s => !s.w)){ stages.forEach(s => s.resize()); if (stages.some(s => !s.w)) return; }
      try { draw(dt, t); } catch(e){ console.error(e); }
    };
    requestAnimationFrame(frame);
  }
  const INK = '#1B1B1B', EDGE = '#39F25F';
  const det = detDriver(), ind = indDriver();
  const sDet = makeStage(document.getElementById('det'), 0.34);
  const sInd = makeStage(document.getElementById('ind'), 0.34);
  const font = (wgt, fs) => `${Math.round(wgt)} ${fs}px "Roboto Flex", "Arial", sans-serif`;
  const OFFS = [];
  for (const [rad, cnt] of [[1, 18], [0.6, 10]]) for (let k=0;k<cnt;k++){ const a = k/cnt*Math.PI*2; OFFS.push([Math.cos(a)*rad, Math.sin(a)*rad]); }
  OFFS.push([0,0]);
  const cv = () => document.createElement('canvas');
  const buf = { base:cv(), baseS:cv(), lq:cv(), lqS:cv(), tint:cv() };
  const X = {}; for (const k in buf) X[k] = buf[k].getContext('2d', { willReadFrequently: k === 'lqS' });

  function layout(st, word, bend, scale){
    const { ctx, w, h } = st, fs = h*0.34*scale;
    const L = word.map(o => { const wgt = 130 + 770*o.f, sx = 0.66 + 0.56*o.f; ctx.font = font(wgt, fs);
      return { ...o, wgt, sx, lw: ctx.measureText(o.c).width*sx }; });
    const total = L.reduce((a,o)=>a+o.lw, 0), cx = w/2, half = total/2;
    const baseY = h*0.5 + fs*0.34 + bend*h*0.18, bendPx = bend*h*0.42;
    let x = cx - half; const edges = [x];
    for (const o of L){ const xc = x + o.lw/2, u = (xc - cx)/half;
      o.x = xc; o.y = baseY - bendPx*(1 - u*u); o.a = Math.atan(bendPx*2*u/half); x += o.lw; edges.push(x); }
    const yAt = px => { const u = clamp((px - cx)/half, -1.2, 1.2); return baseY - bendPx*(1 - u*u) - fs*0.34; };
    // letter-index space (0..n) -> px
    const xAt = uu => { const i = clamp(Math.floor(uu), 0, L.length-1), f = uu - i; return edges[i] + (edges[i+1] - edges[i])*f; };
    return { L, fs, xAt, yAt, x0: edges[0], x1: edges[edges.length-1] };
  }
  function stamp(c, lay, grow, clipX){
    for (const o of lay.L){
      if (clipX !== undefined && o.x > clipX) continue;
      const d = lay.fs*(0.26 + 0.06*o.f)*grow; c.font = font(o.wgt, lay.fs);
      for (const [ox, oy] of OFFS){ c.save(); c.translate(o.x + ox*d, o.y + oy*d); c.rotate(o.a); c.scale(o.sx, 1); c.fillText(o.c, 0, 0); c.restore(); }
    }
  }
  function softInto(src, dst, dc, blur, times){
    dst.width = src.width; dst.height = src.height; const BIG = src.width*2;
    dc.shadowColor = '#fff'; dc.shadowBlur = blur; dc.shadowOffsetX = BIG;
    for (let i=0;i<times;i++) dc.drawImage(src, -BIG, 0);
    dc.shadowBlur = 0; dc.shadowOffsetX = 0;
  }
  // along the word's curve: a thick liquid line from xa to xb
  function liquidLine(c, lay, xa, xb, r){
    if (xb < xa) [xa, xb] = [xb, xa];
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = r*2; c.strokeStyle = '#fff';
    c.beginPath(); const n = Math.max(2, Math.ceil((xb - xa)/6));
    for (let k=0;k<=n;k++){ const x = xa + (xb - xa)*k/n, y = lay.yAt(x); k ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke();
  }
  function blobAt(c, lay, x, r){ c.beginPath(); c.arc(x, lay.yAt(x), r, 0, Math.PI*2); c.fillStyle = '#fff'; c.fill(); }

  // liquid: { fillTo (px or null), tail (px), head (px) } ; faint: draw the see-through base
  function paint(st, lay, liquid, full){
    const { ctx, w, h, dpr } = st, fs = lay.fs;
    // faint base sticker
    const B = buf.base, BC = X.base; B.width = st.c.width; B.height = st.c.height;
    BC.setTransform(dpr,0,0,dpr,0,0); BC.fillStyle = '#fff'; stamp(BC, lay, 1);
    softInto(B, buf.baseS, X.baseS, fs*0.085*dpr, 3);
    if (!full){ ctx.save(); ctx.globalAlpha = 0.045; ctx.drawImage(buf.baseS, 0, 0, w, h); ctx.restore(); }
    // liquid layer at half resolution, then melted + thresholded so shapes merge like goo
    const s = 0.5*dpr, LQ = buf.lq, LC = X.lq;
    LQ.width = Math.ceil(w*s); LQ.height = Math.ceil(h*s);
    LC.setTransform(s,0,0,s,0,0); LC.fillStyle = '#fff';
    if (full) stamp(LC, lay, 1);
    else {
      if (liquid.fillTo !== null){ stamp(LC, lay, 1, liquid.fillTo); liquidLine(LC, lay, lay.x0 + fs*0.2, liquid.fillTo, fs*0.5); }
      const gap = Math.abs(liquid.head - liquid.tail);
      const neck = fs*clamp(0.5 - gap/(fs*6), 0.14, 0.5);
      if (liquid.head !== null){
        liquidLine(LC, lay, liquid.tail, liquid.head, neck);
        blobAt(LC, lay, liquid.head, fs*0.5); blobAt(LC, lay, liquid.tail, fs*0.5*clamp(1 - gap/(fs*5), 0.4, 1));
      }
    }
    const S = buf.lqS, SC = X.lqS; softInto(LQ, S, SC, fs*0.14*s, 2);
    const img = SC.getImageData(0, 0, S.width, S.height), d = img.data;
    for (let i=3;i<d.length;i+=4){ const a = d[i]/255; const t = clamp((a - 0.38)/0.14, 0, 1); d[i] = Math.round(t*t*(3-2*t)*255); }
    SC.putImageData(img, 0, 0);
    // tint + glow
    const T = buf.tint, TC = X.tint; T.width = S.width; T.height = S.height;
    TC.drawImage(S, 0, 0); TC.globalCompositeOperation = 'source-in'; TC.setTransform(s,0,0,s,0,0);
    const g = TC.createLinearGradient(lay.x0 - fs*0.4, 0, lay.x1 + fs*0.4, 0);
    g.addColorStop(0, '#2FE3D2'); g.addColorStop(0.45, '#4DEF8C'); g.addColorStop(0.8, '#8FF3B0'); g.addColorStop(1, '#B4F6C8');
    TC.fillStyle = g; TC.fillRect(0, 0, w, h);
    ctx.save(); ctx.shadowColor = EDGE; ctx.shadowBlur = fs*0.3*dpr; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(T, 0, 0, w, h); ctx.restore();
    // letters: ink where the liquid is, faint where it isn't
    const inside = (x) => {
      if (full) return 1;
      let v = 0;
      if (liquid.fillTo !== null) v = Math.max(v, clamp((liquid.fillTo - x)/(fs*0.4) + 0.5, 0, 1));
      if (liquid.head !== null){ const lo = Math.min(liquid.head, liquid.tail) - fs*0.45, hi = Math.max(liquid.head, liquid.tail) + fs*0.45;
        v = Math.max(v, clamp(Math.min(x - lo, hi - x)/(fs*0.3) + 0.5, 0, 1)); }
      return v;
    };
    ctx.textAlign = 'center';
    for (const o of lay.L){
      const k = inside(o.x);
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.a); ctx.scale(o.sx, 1); ctx.font = font(o.wgt, fs);
      if (k > 0){ ctx.globalAlpha = k; ctx.fillStyle = INK; ctx.fillText(o.c, 0, 0); }
      if (k < 1){ ctx.globalAlpha = (1 - k)*0.28; ctx.fillStyle = '#FFFFFF'; ctx.fillText(o.c, 0, 0); }
      ctx.restore();
    }
  }
  function spring(o, key, vkey, target, dt, k, c){ if (reduce){ o[key] = target; o[vkey] = 0; return; }
    const a = k*(target - o[key]) - c*o[vkey]; o[vkey] += a*dt; o[key] += o[vkey]*dt; }
  const quint = x => x < 0.5 ? 16*x**5 : 1 - Math.pow(-2*x + 2, 5)/2;

  const dS = { bend:0, bv:0, sc:1, sv:0, kicks:0, sign:1, wasDone:false, uh:0, uhv:0, ut:0, utv:0 };
  const iS = { sc:1, sv:0, wasDone:false, uh:0.5, uhv:0, ut:0.5, utv:0 };

  start([sDet, sInd], (dt, t) => {
    det.step(dt, t); ind.step(dt, t);

    // ---- determinate: liquid pours letter by letter; the head races ahead, the body catches up ----
    {
      const st = sDet; st.begin();
      if (det.kicks !== dS.kicks){ dS.kicks = det.kicks; if (!reduce){ dS.bv += 1.6*dS.sign; dS.sign *= -1; } }
      const done = det.doneT >= 0;
      if (done && !dS.wasDone && !reduce){ dS.sv += 3.2; dS.bv += 3; }
      dS.wasDone = done;
      spring(dS, 'bend', 'bv', 0.05, dt, 120, 7); spring(dS, 'sc', 'sv', 1, dt, 160, 9);
      const txt = done ? 'loaded' : 'loading', n = txt.length;
      const p = clamp(det.target, 0, 1);
      if (det.target <= 0 && det.p < 0.01){ dS.uh = dS.ut = 0; dS.uhv = dS.utv = 0; }
      spring(dS, 'uh', 'uhv', p*n, dt, 260, 24);
      spring(dS, 'ut', 'utv', p*n, dt, 30, 9);
      const word = [...txt].map((c, i) => ({ c, f: done ? 1 : ease(clamp(dS.uh - i, 0, 1)) }));
      const lay = layout(st, word, dS.bend, dS.sc);
      const zero = dS.uh < 0.02 && !done;
      paint(st, lay, zero ? { fillTo:null, head:null, tail:null } :
        { fillTo: lay.xAt(clamp(dS.ut, 0, n)), head: lay.xAt(clamp(dS.uh, 0, n)) - lay.fs*0.1, tail: lay.xAt(clamp(dS.ut, 0, n)) }, done);
      st.c.parentElement.setAttribute('aria-valuenow', done ? 100 : Math.round(det.p*100));
    }

    // ---- indeterminate: a drop of liquid hops from letter to letter, stretching as it goes ----
    {
      const st = sInd; st.begin();
      const run = ind.run, done = ind.phase === 'done', idle = ind.phase === 'idle';
      if (done && !iS.wasDone && !reduce) iS.sv += 3.2;
      iS.wasDone = done;
      spring(iS, 'sc', 'sv', 1, dt, 160, 9);
      const txt = done ? 'loaded' : 'loading', n = txt.length;
      // ping-pong hop with a short rest on each letter
      const rate = 1.9, cyc = (n - 1)*2, q = (t*rate) % cyc, k = Math.floor(q), f = quint(clamp((q - k)*2.2, 0, 1));
      const idx = kk => { kk = ((kk % cyc) + cyc) % cyc; return kk <= n-1 ? kk : cyc - kk; };
      const target = idle ? 0.5 : idx(k) + (idx(k+1) - idx(k))*f + 0.5;
      spring(iS, 'uh', 'uhv', target, dt, 320, 26);
      spring(iS, 'ut', 'utv', target, dt, 26, 8);
      const word = [...txt].map((c, i) => ({ c, f: done ? 0.95 : clamp(1 - Math.abs(i + 0.5 - iS.uh)*0.9, 0, 1)*(idle ? 0.2 : 1)*Math.max(run, 0.2) + 0.12 }));
      const bend = reduce ? 0 : Math.sin(t*2.2)*0.14*run;
      const lay = layout(st, word, bend, iS.sc);
      paint(st, lay, idle ? { fillTo:null, head:null, tail:null } :
        { fillTo:null, head: lay.xAt(clamp(iS.uh, 0, n)), tail: lay.xAt(clamp(iS.ut, 0, n)) }, done);
    }
  });
  try { document.fonts.load('900 40px "Roboto Flex"'); document.fonts.load('150 40px "Roboto Flex"'); } catch(e){}
})();
</script>
</body>
</html>
