<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA; --ink:#1F1F1F; --track:rgba(20,30,60,.035);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); font-family:Geist, system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:60px; min-height:340px; position:relative; overflow:hidden}
body::before{content:""; position:fixed; inset:-20%; pointer-events:none; filter:blur(40px); opacity:.45;
  background:radial-gradient(18% 22% at 32% 40%, #F4C9D8, transparent 70%), radial-gradient(16% 20% at 64% 42%, #DCCDF3, transparent 70%),
    radial-gradient(18% 22% at 46% 66%, #CFEDE2, transparent 70%), radial-gradient(16% 20% at 72% 70%, #F2D4E8, transparent 70%)}
.row{position:relative; display:flex; gap:22px; padding:18px 26px; border-radius:999px; background:rgba(255,255,255,.45);
  backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), inset 0 1px 0 #fff, 0 10px 30px rgba(30,40,80,.08)}
.hop{all:unset; box-sizing:border-box; position:relative; width:52px; height:52px; cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:50%}
.hop:focus-visible{outline:2px solid #2E2C38; outline-offset:5px}
.anchor{position:absolute; inset:0; border-radius:50%; transform-origin:50% 100%; display:grid; place-items:center;
  background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.35));
  backdrop-filter:blur(10px) saturate(1.5); -webkit-backdrop-filter:blur(10px) saturate(1.5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.95), inset 0 2px 2px #fff, inset 0 -4px 8px rgba(110,100,150,.12), 0 6px 16px rgba(60,50,90,.10)}
.anchor::before{content:""; position:absolute; inset:0; border-radius:50%; padding:1.5px; opacity:.55;
  background:conic-gradient(from 200deg, #F7C8DA, #DCCDF3, #CFEDE2, #F7E3C8, #F7C8DA);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude}
.anchor svg{position:relative; width:26px; height:26px; color:#2E2C38}
.badge{position:absolute; left:36px; top:-6px; height:22px; pointer-events:none}
.p{position:absolute; left:11px; top:11px; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(120,112,145,.9), rgba(36,33,48,.88)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); opacity:0}
.pill{position:absolute; left:0; top:0; height:22px; min-width:22px; padding:0 7px; border-radius:999px; color:#fff; overflow:hidden;
  background:linear-gradient(180deg, rgba(70,64,90,.72), rgba(30,28,40,.82)); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), inset 0 1px 0 rgba(255,255,255,.45), 0 4px 12px rgba(30,25,50,.22);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; white-space:nowrap; opacity:0; font-variant-numeric:tabular-nums}
.pill::after{content:""; position:absolute; left:4px; right:4px; top:1px; height:45%; border-radius:999px; background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0))}
.pill svg{width:13px; height:13px}
.on .pill{opacity:1}
.k-dot .badge{left:40px; top:-2px; width:12px; height:12px}
.k-dot .p{left:6px; top:6px}
.core{position:absolute; left:0; top:0; width:12px; height:12px; border-radius:50%; transform:scale(0);
  background:radial-gradient(circle at 35% 30%, rgba(120,112,145,.95), rgba(36,33,48,.9));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3), 0 2px 6px rgba(30,25,50,.25)}
.on .core{transform:scale(1)}
@media (hover:hover){ .hop:hover .anchor{background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.55))} }
</style>
</head>
<body>
  <nav class="row" id="dots" aria-label="Badge without content"></nav>
  <nav class="row" id="pills" aria-label="Badge with content"></nav>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COL = Array(4).fill({ c:'#2A2734', c2:'#FFFFFF' });
  const GLYPH = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 5.5 8-5.5"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.2 3.6c.6-.4 1.4-.3 1.9.3l2 2.6c.5.6.4 1.5-.2 2l-1.3 1.1a12 12 0 0 0 4.8 4.8l1.1-1.3c.5-.6 1.4-.7 2-.2l2.6 2c.6.5.7 1.3.3 1.9l-1 1.6c-.6 1-1.8 1.5-3 1.2C10.9 18.2 5.8 13.1 4.4 7.6c-.3-1.2.2-2.4 1.2-3z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l5-3v9l-5-3" fill="currentColor"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7.5L7 21v-3.5H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M8 10h8M8 13.5h5"/></svg>'
  ];
  const NAMES = ['Email', 'Phone', 'Meeting', 'Chat'];
  const CONTENT = [
    { html:'3', say:'3 new' },
    { html:'New', say:'new' },
    { html:'99+', say:'99 or more' },
    { html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3.5 3.5M14.9 14.9l3.5 3.5M5.6 18.4l3.5-3.5M14.9 9.1l3.5-3.5"/></svg>', say:'highlight' }
  ];
  const N = 8;
  const make = (kind, i) => {
    const b = document.createElement('button'); b.className = 'hop k-' + kind;
    b.style.cssText = `--c:${COL[i].c}; --c2:${COL[i].c2}`;
    b.innerHTML = `<span class="anchor">${GLYPH[i]}</span><span class="badge">${'<span class="p"></span>'.repeat(N)}${kind === 'dot' ? '<span class="core"></span>' : `<span class="pill">${CONTENT[i].html}</span>`}</span>`;
    b.setAttribute('aria-label', NAMES[i]); b.setAttribute('aria-pressed', 'false');
    b._i = i; b._kind = kind; b.addEventListener('click', () => toggle(b));
    return b;
  };
  const dots = document.getElementById('dots'), pills = document.getElementById('pills');
  for (let i = 0; i < 4; i++){ dots.appendChild(make('dot', i)); pills.appendChild(make('pill', i)); }

  const q = (el, s) => el.querySelector(s), qa = (el, s) => [...el.querySelectorAll(s)];
  const kill = b => b.getAnimations({ subtree:true }).forEach(a => a.cancel());
  const T = (x, y, s = 1) => `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(3)})`;
  const run = (el, frames, dur) => el.animate(frames, { duration:dur, fill:'both' });

  // ---------- badge with content: hop, pinwheel cluster, then the circles line up and fuse into a pill ----------
  function pillIn(b){
    const a = q(b,'.anchor'), pill = q(b,'.pill'), ps = qa(b,'.p').slice(0, 5), D = 1250;
    const W = Math.max(22, Math.ceil(pill.scrollWidth));
    const sx = -21, sy = 21, cx = W/2 - 11, gap = Math.max(1.5, (W - 14) / 4);
    run(a, [
      { offset:0, transform:'translateY(0) scale(1,1)', easing:'cubic-bezier(.3,0,.5,1)' },
      { offset:.12, transform:'translateY(3px) scale(1.12,.86)', easing:'cubic-bezier(.2,.8,.4,1)' },
      { offset:.32, transform:'translateY(-24px) scale(.9,1.1)', easing:'cubic-bezier(.6,0,.85,.5)' },
      { offset:.48, transform:'translateY(0) scale(1.15,.85)', easing:'cubic-bezier(.3,1.4,.5,1)' },
      { offset:.62, transform:'translateY(-3px) scale(.97,1.03)' },
      { offset:1, transform:'translateY(0) scale(1,1)' }], D);
    ps.forEach((p, k) => {
      const f = [{ offset:0, transform:T(sx, sy, 0), opacity:0 }, { offset:.26, transform:T(sx, sy - 18, .4), opacity:0 }];
      // pinwheel: center circle stays, four orbit around it while the whole group turns
      const steps = 7;
      for (let s = 0; s <= steps; s++){
        const t = .3 + s * (.42 / steps), turn = s / steps * Math.PI * 1.75 + Math.PI/4;
        const R = k === 0 ? 0 : 9 + Math.sin(s / steps * Math.PI) * 3;
        const ang = turn + (k - 1) * Math.PI / 2;
        f.push({ offset:t, transform:T(cx + R * Math.cos(ang), R * Math.sin(ang), s === 0 ? .7 : 1), opacity:1, easing:'linear' });
      }
      const order = [2, 0, 1, 3, 4][k];
      f.push({ offset:.84, transform:T(cx + (order - 2) * gap, 0, .95), opacity:1, easing:'cubic-bezier(.3,1.3,.5,1)' });
      f.push({ offset:.92, transform:T(cx + (order - 2) * gap * .6, 0, .7), opacity:0 });
      f.push({ offset:1, transform:T(cx, 0, .6), opacity:0 });
      run(p, f, D);
    });
    run(pill, [
      { offset:0, opacity:0, transform:'scale(.6,.5)' }, { offset:.83, opacity:0, transform:'scale(.6,.5)', easing:'cubic-bezier(.3,1.5,.5,1)' },
      { offset:.92, opacity:1, transform:'scale(1.08,.94)' }, { offset:1, opacity:1, transform:'scale(1,1)' }], D);
    [...pill.childNodes].length && pill.animate([{ color:'transparent' }, { offset:.88, color:'transparent' }, { color:'#fff' }], { duration:D, fill:'both' });
  }
  function pillOut(b){
    const a = q(b,'.anchor'), pill = q(b,'.pill'), ps = qa(b,'.p').slice(0, 5), D = 900;
    const W = Math.max(22, Math.ceil(pill.scrollWidth));
    const sx = -21, sy = 21, cx = W/2 - 11, gap = Math.max(1.5, (W - 14) / 4);
    run(pill, [{ offset:0, opacity:1, transform:'scale(1)' }, { offset:.08, opacity:1, transform:'scale(1.06,.94)' }, { offset:.2, opacity:0, transform:'scale(.7,.6)' }, { offset:1, opacity:0, transform:'scale(.7,.6)' }], D);
    ps.forEach((p, k) => {
      const order = [2, 0, 1, 3, 4][k];
      const f = [{ offset:0, transform:T(cx + (order - 2) * gap, 0, .9), opacity:0 }, { offset:.16, transform:T(cx + (order - 2) * gap, 0, 1), opacity:1 }];
      const steps = 6;
      for (let s = 0; s <= steps; s++){
        const t = .22 + s * (.38 / steps), turn = s / steps * Math.PI * 1.5 + Math.PI/4;
        const R = k === 0 ? 0 : 10 - s / steps * 5;
        const ang = turn + (k - 1) * Math.PI / 2;
        f.push({ offset:t, transform:T(cx + R * Math.cos(ang), R * Math.sin(ang), 1 - s / steps * .3), opacity:1, easing:'linear' });
      }
      f.push({ offset:.82, transform:T(sx, sy, .3), opacity:1, easing:'cubic-bezier(.6,0,.9,.6)' });
      f.push({ offset:.86, transform:T(sx, sy, 0), opacity:0 });
      f.push({ offset:1, transform:T(sx, sy, 0), opacity:0 });
      run(p, f, D);
    });
    run(a, [
      { offset:0, transform:'translateY(0) scale(1,1)' }, { offset:.8, transform:'translateY(0) scale(1,1)', easing:'ease-out' },
      { offset:.88, transform:'translateY(2px) scale(1.1,.9)', easing:'cubic-bezier(.3,1.4,.5,1)' }, { offset:1, transform:'translateY(0) scale(1,1)' }], D);
  }

  // ---------- badge without content: particles implode into the dot, it hops; clearing explodes it back out ----------
  const ring = (k, r, turn) => { const inner = k < 4, ang = turn + (k % 4) * Math.PI/2 + (inner ? Math.PI/4 : 0); return [r * (inner ? .55 : 1) * Math.cos(ang), r * (inner ? .55 : 1) * Math.sin(ang)]; };
  function dotIn(b){
    const core = q(b,'.core'), ps = qa(b,'.p'), D = 1000;
    ps.forEach((p, k) => {
      const f = [];
      for (let s = 0; s <= 6; s++){
        const t = s / 6 * .5, r = 26 * (1 - s / 6), [x, y] = ring(k, r, -s / 6 * Math.PI * .9);
        f.push({ offset:t, transform:T(x, y, (k < 4 ? .45 : .7) * (1 - s / 6 * .5)), opacity:s === 0 ? 0 : 1, easing:s === 0 ? 'ease-out' : 'cubic-bezier(.5,0,.9,.5)' });
      }
      f.push({ offset:.52, transform:T(0, 0, .2), opacity:0 }); f.push({ offset:1, transform:T(0, 0, 0), opacity:0 });
      run(p, f, D);
    });
    run(core, [
      { offset:0, transform:'translateY(0) scale(0)' }, { offset:.48, transform:'translateY(0) scale(0)', easing:'cubic-bezier(.3,1.6,.5,1)' },
      { offset:.6, transform:'translateY(0) scale(1.45)', easing:'cubic-bezier(.3,.6,.4,1)' },
      { offset:.72, transform:'translateY(-12px) scale(.9,1.12)', easing:'cubic-bezier(.6,0,.85,.5)' },
      { offset:.84, transform:'translateY(0) scale(1.3,.72)', easing:'cubic-bezier(.3,1.4,.5,1)' },
      { offset:.93, transform:'translateY(-2px) scale(.94,1.06)' }, { offset:1, transform:'translateY(0) scale(1)' }], D);
  }
  function dotOut(b){
    const core = q(b,'.core'), ps = qa(b,'.p'), D = 820;
    run(core, [
      { offset:0, transform:'translateY(0) scale(1)', easing:'ease-out' }, { offset:.14, transform:'translateY(1px) scale(1.3,.75)', easing:'cubic-bezier(.3,.6,.4,1)' },
      { offset:.26, transform:'translateY(-6px) scale(1.15)' }, { offset:.34, transform:'translateY(-6px) scale(0)' }, { offset:1, transform:'translateY(-6px) scale(0)' }], D);
    ps.forEach((p, k) => {
      const f = [{ offset:0, transform:T(0, -6, 0), opacity:0 }, { offset:.3, transform:T(0, -6, .3), opacity:1 }];
      for (let s = 1; s <= 6; s++){
        const t = .3 + s / 6 * .62, r = 28 * Math.pow(s / 6, .7), [x, y] = ring(k, r, s / 6 * Math.PI * .9);
        f.push({ offset:t, transform:T(x, y - 6, (k < 4 ? .45 : .7) * (1 - s / 6 * .6)), opacity:s > 4 ? 1 - (s - 4) / 2 : 1, easing:'cubic-bezier(.2,.7,.4,1)' });
      }
      f.push({ offset:1, transform:T(...ring(k, 28, Math.PI * .9).map((v, j) => j ? v - 6 : v), 0), opacity:0 });
      run(p, f, D);
    });
    run(q(b,'.anchor'), [{ transform:'scale(1)' }, { offset:.1, transform:'scale(1.06,.94)' }, { offset:.3, transform:'scale(1)' }, { transform:'scale(1)' }], D);
  }

  function toggle(b, force){
    const on = force ?? !b.classList.contains('on');
    if (on === b.classList.contains('on')) return;
    kill(b); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', NAMES[b._i] + (on ? (b._kind === 'dot' ? ', new activity' : ', ' + CONTENT[b._i].say) : ''));
    if (reduce) return;
    if (b._kind === 'dot') (on ? dotIn : dotOut)(b); else (on ? pillIn : pillOut)(b);
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    setTimeout(() => toggle(dots.children[1], true), 600);
    setTimeout(() => toggle(pills.children[0], true), 1200);
  });
})();
</script>
</body>
</html>
