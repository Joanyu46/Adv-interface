<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tooltip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --page:#F2F2F7; --card:#FFFFFF; --navy:#1B2A72; --blue:#0A84FF; --tip:rgba(58,58,60,.94); --label2:rgba(60,60,67,.6); --route:#9DBBF2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:28px 0; background:var(--page); font-family:var(--font); -webkit-font-smoothing:antialiased}
button{font:inherit}
.card{position:relative; width:min(560px, 100vw - 24px); height:280px; border-radius:28px; background:var(--card); overflow:hidden; box-shadow:0 1px 0 rgba(0,0,0,.02), 0 12px 32px rgba(0,0,0,.06)}
.card.rich{height:400px}
.head{position:absolute; left:24px; top:20px; font-size:13px; font-weight:600; color:var(--label2)}
svg.scene{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.route, .neon, .me{opacity:0 !important}
.route{fill:none; stroke:var(--route); stroke-width:5; stroke-linecap:round; stroke-dasharray:14 10}
.neon{fill:none; stroke:url(#neonGrad); stroke-width:5; stroke-linecap:round; stroke-dasharray:0 1000; stroke-dashoffset:1; filter:drop-shadow(0 2px 6px rgba(94,92,230,.35))}
.me{position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.2)}
.me::after{content:""; position:absolute; inset:-3px; border-radius:50%; box-shadow:0 0 0 0 rgba(10,132,255,.35); animation:ping 2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 18px rgba(10,132,255,0)}}
.pin{all:unset; position:absolute; width:46px; height:58px; margin:-58px 0 0 -23px; cursor:pointer; transform-origin:50% 100%; -webkit-tap-highlight-color:transparent; z-index:2}
.pin:focus-visible{outline:2px solid var(--blue); outline-offset:4px; border-radius:14px}
.pin svg{width:100%; height:100%; overflow:visible; display:block}
.pin .seg{fill:none; stroke-width:3; stroke-linecap:round; stroke-dasharray:0 100; opacity:0}
.shadow{position:absolute; width:22px; height:7px; margin:-3.5px 0 0 -11px; border-radius:50%; background:rgba(27,42,114,.22); filter:blur(1.5px); pointer-events:none}
.hex{position:absolute; width:150px; height:150px; margin:-75px 0 0 -75px; pointer-events:none; overflow:visible}
.hex path{fill:none; stroke-width:2.5; stroke-linecap:round; stroke-dasharray:0 100; opacity:0}
/* plain */
.tip{position:absolute; left:0; top:0; height:40px; padding:0 16px; border-radius:13px; background:var(--tip); color:#fff; display:flex; align-items:center; gap:10px; font-size:16px; font-weight:500; letter-spacing:-.2px; white-space:nowrap;
  pointer-events:none; opacity:0; z-index:3; transform-origin:50% calc(100% + 8px); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px)}
.tip::after, .rich-tip::after{content:""; position:absolute; left:50%; bottom:-7px; width:16px; height:16px; margin-left:-8px; background:inherit; transform:rotate(45deg); border-radius:0 0 4px 0}
.tip svg{width:20px; height:20px}
.tip .dotsep{opacity:.6}
.num{display:inline-block; font-variant-numeric:tabular-nums}
.sonar, .burst{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1}
.tip .inner{display:flex; align-items:center; gap:10px; white-space:nowrap}
.tip .ok{color:#30D158}
.tip.blob::after{opacity:0}
.tip::after{transition:opacity .15s ease}
/* rich */
.rich-tip{position:absolute; left:0; top:0; width:280px; padding:14px 14px 14px; border-radius:20px; background:var(--tip); color:#fff; pointer-events:none; opacity:0; z-index:3; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 18px 44px rgba(0,0,0,.22)}
.rich-tip.show{pointer-events:auto}
.rt{display:flex; gap:12px; align-items:center}
.rt .pbadge{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:#fff; color:var(--navy); font-weight:800; font-size:20px; flex:none}
.rt b{display:block; font-size:15.5px; font-weight:600; letter-spacing:-.24px}
.rt span{font-size:13px; color:rgba(235,235,245,.6)}
.avail{display:flex; gap:3px; margin:12px 0 10px}
.avail i{flex:1; height:6px; border-radius:3px; background:rgba(235,235,245,.18)}
.avail i.f{background:#30D158}
.eta{display:flex; align-items:center; gap:8px; font-size:14px; color:rgba(235,235,245,.85); margin-bottom:12px}
.eta svg{width:18px; height:18px}
.acts{display:flex; gap:8px}
.go{all:unset; flex:1; height:40px; border-radius:12px; background:var(--blue); color:#fff; font-size:14.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; position:relative; overflow:hidden}
.go svg{width:16px; height:16px}
.go:focus-visible, .save:focus-visible{outline:2px solid #fff; outline-offset:2px}
.save{all:unset; width:44px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(235,235,245,.14); color:#fff; cursor:pointer}
.save svg{width:18px; height:18px}
.save[aria-pressed="true"] svg{fill:#FFD60A; stroke:#FFD60A}
svg.sf{fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="neonGrad" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#2AD4FF"/><stop offset=".4" stop-color="#3D5BFF"/><stop offset=".75" stop-color="#9B4DFF"/><stop offset="1" stop-color="#FF4DB8"/></linearGradient>
    <linearGradient id="segGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3D5BFF"/><stop offset="1" stop-color="#9B4DFF"/></linearGradient>
  </defs></svg>

  <section class="card plain" id="plain" aria-label="Map pin, plain tooltip"></section>
  <section class="card rich" id="rich" aria-label="Map pin, rich tooltip"></section>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = ms => reduce ? 1 : ms;
  const PIN = `<svg viewBox="0 0 46 58"><path d="M23 56 L15 41 A19 19 0 1 1 31 41 Z" fill="#1B2A72"/><circle cx="23" cy="23" r="17" fill="#fff"/><circle cx="23" cy="23" r="17" fill="none" stroke="#1B2A72" stroke-width="3"/>
    <circle class="seg s1" cx="23" cy="23" r="21" pathLength="100" stroke="url(#segGrad)"/><circle class="seg s2" cx="23" cy="23" r="21" pathLength="100" stroke="url(#segGrad)"/><circle class="seg s3" cx="23" cy="23" r="21" pathLength="100" stroke="url(#segGrad)"/>
    <text x="23" y="30.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="21" font-weight="700" fill="#1B2A72">P</text></svg>`;
  const SCOOT = '<svg class="sf" viewBox="0 0 24 24"><path d="M14 5h2.5l2.5 11"/><circle cx="6" cy="17.5" r="2.2"/><circle cx="19" cy="17.5" r="2.2"/><path d="M8.2 17.5H17"/></svg>';
  const HEX = '<svg class="hex" viewBox="-75 -75 150 150">' + [0, 1, 2].map(i => `<path class="h${i}" pathLength="100" stroke="url(#segGrad)" d="M0 -62 L53.7 -31 L53.7 31 L0 62 L-53.7 31 L-53.7 -31 Z" stroke-linejoin="round"/>`).join('') + '</svg>';

  function build(card, rich){
    card.insertAdjacentHTML('beforeend', `<svg class="scene" aria-hidden="true"><path class="route"/>${rich ? '<path class="neon"/>' : ''}</svg>
      <span class="me" aria-hidden="true"></span>${rich ? HEX : '<canvas class="sonar" aria-hidden="true"></canvas><canvas class="burst" aria-hidden="true"></canvas>'}<span class="shadow"></span>
      <button class="pin" aria-label="Parking, Lakeside Plaza" aria-describedby="${card.id}-tip">${PIN}</button>` + (rich
      ? `<div class="rich-tip" id="${card.id}-tip" role="tooltip">
          <div class="rt"><span class="pbadge">P</span><div><b>Lakeside Plaza Parking</b><span>Level 2 · open 24 hours</span></div></div>
          <div class="avail" aria-label="38 of 50 spots free">${'<i></i>'.repeat(12)}</div>
          <div class="eta">${SCOOT}<span><span class="num m">1</span> min · <span class="num k">0.02</span> km · 38 spots free</span></div>
          <div class="acts"><button class="go"><svg class="sf" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M4 11l16-7-7 16-2-7z"/></svg>Start route</button>
            <button class="save" aria-label="Save place" aria-pressed="false"><svg class="sf" viewBox="0 0 24 24"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg></button></div>
        </div>`
      : `<div class="tip" id="${card.id}-tip" role="tooltip"><span class="inner">${SCOOT}<span><span class="num m">1</span> min</span><span class="dotsep">·</span><span><span class="num k">0.02</span> km</span></span></div>`));
    const q = s => card.querySelector(s);
    const pin = q('.pin'), shadow = q('.shadow'), me = q('.me'), tip = q(rich ? '.rich-tip' : '.tip'), route = q('.route'), neon = q('.neon'), hex = q('.hex');
    let P = {}, M = {};
    function layout(){
      const W = card.clientWidth, H = card.clientHeight;
      P = { x:W * .5, y:H - (rich ? 70 : 64) }; M = { x:W * .18, y:H - (rich ? 34 : 34) };
      pin.style.left = P.x + 'px'; pin.style.top = P.y + 'px'; shadow.style.left = P.x + 'px'; shadow.style.top = P.y + 'px';
      me.style.left = M.x + 'px'; me.style.top = M.y + 'px';
      const d = `M${M.x} ${M.y} C ${M.x + 90} ${M.y + 10}, ${P.x - 110} ${P.y + 30}, ${P.x} ${P.y + 2}`;
      route.setAttribute('d', d); if (neon) neon.setAttribute('d', d);
      if (hex){ hex.style.left = P.x + 'px'; hex.style.top = (P.y - 35) + 'px'; }
      const w = tip.offsetWidth, h = tip.offsetHeight, x = Math.max(12, Math.min(W - w - 12, P.x - w / 2));
      tip.style.left = x + 'px'; tip.style.top = (P.y - 58 - 14 - h) + 'px';
      tip.style.transformOrigin = `${P.x - x}px calc(100% + 10px)`;
      tip.style.setProperty('--ax', (P.x - x) + 'px');
    }
    layout(); addEventListener('resize', layout);

    // the pin crouches, leaps, lands with a squash; three arcs grow from different points and close into a ring
    function hop(){
      if (reduce) return;
      pin.animate([{ transform:'translateY(0) scale(1,1)' }, { offset:.14, transform:'translateY(0) scale(1.16,.82)', easing:'cubic-bezier(.3,0,.4,1)' },
        { offset:.42, transform:'translateY(-26px) scale(.9,1.12)', easing:'cubic-bezier(.6,0,.8,.5)' }, { offset:.6, transform:'translateY(0) scale(1.18,.84)', easing:'cubic-bezier(.3,1.4,.5,1)' },
        { offset:.78, transform:'translateY(-5px) scale(.96,1.04)' }, { offset:.9, transform:'translateY(0) scale(1.02,.98)' }, { transform:'translateY(0) scale(1,1)' }], { duration:760 });
      shadow.animate([{ transform:'scale(1)', opacity:1 }, { offset:.14, transform:'scale(1.25)' }, { offset:.42, transform:'scale(.45)', opacity:.4 }, { offset:.6, transform:'scale(1.35)', opacity:1 }, { transform:'scale(1)', opacity:1 }], { duration:760 });
      ['.s1', '.s2', '.s3'].forEach((s, i) => pin.querySelector(s).animate([
        { strokeDasharray:'0 100', strokeDashoffset:-i * 33.3, opacity:1 }, { offset:.5, strokeDasharray:'33.4 100', strokeDashoffset:-i * 33.3 - 0, opacity:1 },
        { offset:.7, strokeDasharray:'33.4 100', strokeDashoffset:-i * 33.3, opacity:1 }, { strokeDasharray:'33.4 100', strokeDashoffset:-i * 33.3, opacity:0, transform:'scale(1.3)', transformOrigin:'23px 23px' }], { duration:900, delay:340, easing:'cubic-bezier(.3,.7,.3,1)', fill:'backwards' }));
    }
    function count(){
      const m = tip.querySelector('.m'), k = tip.querySelector('.k'), t0 = performance.now(), D = T(600);
      (function tick(now){ const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3); m.textContent = Math.max(1, Math.round(1 * e)); k.textContent = (0.02 * e).toFixed(2); if (p < 1) requestAnimationFrame(tick); })(t0);
    }
    // concentric rings of dots ripple out of the pin head, inner ring first
    const sonar = q('.sonar'); let sraf;
    function ripple(){
      if (!sonar || reduce) return;
      const dpr = Math.min(2, devicePixelRatio || 1), W = card.clientWidth, H = card.clientHeight;
      sonar.width = W * dpr; sonar.height = H * dpr; const ctx = sonar.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cx = P.x, cy = P.y - 35, t0 = performance.now(), rings = [{ n:8, r:26 }, { n:14, r:44 }, { n:20, r:62 }, { n:26, r:80 }];
      cancelAnimationFrame(sraf);
      (function draw(now){
        ctx.clearRect(0, 0, W, H); let alive = false;
        rings.forEach((g, i) => {
          const k = (now - t0 - i * 70) / 900; if (k < 0){ alive = true; return; } if (k > 1) return; alive = true;
          const e = 1 - Math.pow(1 - k, 3), rad = g.r * (.35 + .65 * e), a = k < .25 ? k / .25 : 1 - (k - .25) / .75, spin = e * .35 * (i % 2 ? -1 : 1);
          for (let j = 0; j < g.n; j++){
            const ang = j / g.n * Math.PI * 2 + spin;
            ctx.globalAlpha = Math.max(0, a) * (1 - i * .14);
            ctx.fillStyle = i % 2 ? '#7B4DFF' : '#3D5BFF';
            ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, 2.6 - i * .3 - e * .6, 0, 6.283); ctx.fill();
          }
        });
        ctx.globalAlpha = 1;
        if (alive) sraf = requestAnimationFrame(draw); else ctx.clearRect(0, 0, W, H);
      })(t0);
    }
    // the tooltip leaves the pin as a wobbling blob, flickers with an RGB split, and settles into the capsule
    const G1 = 'drop-shadow(-4px 0 0 rgba(255,40,190,.85)) drop-shadow(4px 0 0 rgba(40,230,120,.85))', G2 = 'drop-shadow(3px 1px 0 rgba(255,40,190,.8)) drop-shadow(-3px -1px 0 rgba(40,230,120,.8))', G0 = 'drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 rgba(0,0,0,0))';
    function travel(dir){
      const dy = (P.y - 30) - (parseFloat(tip.style.top) + tip.offsetHeight + 10);
      const B = ['48% 52% 60% 40% / 55% 42% 58% 45%', '62% 38% 45% 55% / 40% 60% 40% 60%', '38% 62% 55% 45% / 60% 45% 55% 40%'];
      tip.classList.add('blob');
      const kf = [
        { opacity:0, transform:`translateY(${dy}px) scale(.06,.3)`, borderRadius:B[0], filter:G0 },
        { offset:.14, opacity:1, transform:`translateY(${dy * .8}px) scale(.15,.8) rotate(-8deg)`, borderRadius:B[1], filter:G1 },
        { offset:.26, opacity:1, transform:`translateY(${dy * .55}px) scale(.2,.95) rotate(6deg)`, borderRadius:B[2], filter:G0 },
        { offset:.4, opacity:1, transform:`translateY(${dy * .22}px) scale(.3,1.05) rotate(-3deg)`, borderRadius:B[0], filter:G2 },
        { offset:.52, opacity:1, transform:'translateY(-6px) scale(.85,1.02) rotate(0deg)', borderRadius:B[1], filter:G0 },
        { offset:.62, opacity:1, transform:'translateY(0) scale(1.07,.93)', borderRadius:'13px 13px 13px 13px', filter:G1 },
        { offset:.7, opacity:1, transform:'translateY(0) scale(1.02,.98)', borderRadius:'13px 13px 13px 13px', filter:G0 },
        { offset:.84, opacity:1, transform:'translateY(0) scale(.99,1.02)', borderRadius:'13px 13px 13px 13px', filter:G0 },
        { opacity:1, transform:'translateY(0) scale(1)', borderRadius:'13px 13px 13px 13px', filter:G0 }];
      const a = tip.animate(dir > 0 ? kf : [...kf].reverse().map((f, i, arr) => ({ ...f, offset:undefined })), { duration:T(dir > 0 ? 1000 : 560), easing:dir > 0 ? 'cubic-bezier(.35,.55,.35,1)' : 'cubic-bezier(.5,0,.7,.4)', fill:'both' });
      setTimeout(() => tip.classList.toggle('blob', dir < 0), T(dir > 0 ? 640 : 0));
      return a;
    }
    let open = false, timer;
    function show(){
      clearTimeout(timer); if (open) return; open = true; layout(); hop(); tip.classList.add('show');
      tip.getAnimations({ subtree:true }).forEach(a => a.cancel());
      const D = T(rich ? 900 : 640), o = { duration:D, fill:'both' };
      // the tooltip springs off the top of the pin as it lands
      if (rich) tip.animate([{ opacity:0, transform:'scale(.2,.1)', filter:'blur(6px)' }, { offset:.35, opacity:0, transform:'scale(.2,.1)', filter:'blur(6px)', easing:'cubic-bezier(.3,1.35,.5,1)' },
        { offset:.72, opacity:1, transform:'scale(1.04,1.02)', filter:'blur(0px)' }, { opacity:1, transform:'scale(1)', filter:'blur(0px)' }], o);
      else { setTimeout(() => { if (open){ ripple(); travel(1); } }, T(300)); tip.style.opacity = 0; }
      const parts = rich ? [...tip.querySelectorAll('.rt, .avail, .eta, .acts')] : [...tip.querySelector('.inner').children];
      parts.forEach((p, i) => p.animate([{ opacity:0, transform:'translateY(8px)', filter:'blur(3px)' }, { offset:(rich ? .5 : .78) + i * (rich ? .08 : .05), opacity:0, transform:'translateY(8px)', filter:'blur(3px)', easing:'cubic-bezier(.2,.9,.3,1.15)' },
        { opacity:1, transform:'none', filter:'blur(0px)' }], { duration:rich ? D + 200 : T(1350), fill:'both' }));
      setTimeout(count, T(rich ? 420 : 900));
      if (rich){
        const cells = [...tip.querySelectorAll('.avail i')];
        cells.forEach((c, i) => { c.className = i < 9 ? 'f' : ''; if (i < 9 && !reduce) c.animate([{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }], { duration:300, delay:520 + i * 35, easing:'cubic-bezier(.2,.9,.3,1.2)', fill:'backwards' }); });
        // the route lights up in a gradient, and a hexagon fence is drawn in pieces around the pin
        const L = neon.getTotalLength();
        neon.animate([{ strokeDasharray:`0 ${L}` }, { strokeDasharray:`${L} ${L}` }], { duration:T(900), delay:T(200), easing:'cubic-bezier(.6,0,.2,1)', fill:'both' });
        hex.querySelectorAll('path').forEach((p, i) => p.animate([{ strokeDasharray:'0 100', strokeDashoffset:-i * 33.3, opacity:.9 }, { strokeDasharray:'33.4 100', strokeDashoffset:-i * 33.3, opacity:.9 }],
          { duration:T(700), delay:T(260 + i * 60), easing:'cubic-bezier(.5,0,.2,1)', fill:'both' }));
      }
    }
    function hide(){
      if (!open) return; open = false; tip.classList.remove('show');
      if (rich) tip.animate([{ opacity:1, transform:'scale(1)', filter:'blur(0px)' }, { offset:.3, opacity:1, transform:'scale(1.04,.94)' }, { opacity:0, transform:'scale(.2,.1)', filter:'blur(6px)' }], { duration:T(300), easing:'cubic-bezier(.5,0,.75,0)', fill:'both' });
      else { clearTimeout(rollT); if (rolled){ rolled = false; setTimeout(() => { tip.querySelector('.inner').innerHTML = `${SCOOT}<span><span class="num m">1</span> min</span><span class="dotsep">·</span><span><span class="num k">0.02</span> km</span>`; layout(); }, T(600)); } tip.getAnimations({ subtree:true }).forEach(a => a.cancel()); [...tip.querySelector('.inner').children].forEach(c => c.animate([{ opacity:1 }, { opacity:0 }], { duration:T(120), fill:'both' })); travel(-1); }
      if (!reduce) pin.animate([{ transform:'scale(1)' }, { transform:'scale(1.08,.9)' }, { transform:'scale(1)' }], { duration:320, delay:180 });
      if (rich){
        const L = neon.getTotalLength();
        neon.animate([{ strokeDasharray:`${L} ${L}`, strokeDashoffset:0 }, { strokeDasharray:`${L} ${L}`, strokeDashoffset:-L }], { duration:T(500), easing:'cubic-bezier(.6,0,.4,1)', fill:'both' });
        // the fence breaks into fragments that fall in toward the pin
        hex.querySelectorAll('path').forEach((p, i) => p.animate([{ strokeDasharray:'33.4 100', strokeDashoffset:-i * 33.3, opacity:.9, transform:'scale(1)' },
          { strokeDasharray:'6 27.3', strokeDashoffset:-i * 33.3 - 10, opacity:.9, transform:'scale(.8)', offset:.5 }, { strokeDasharray:'0 100', strokeDashoffset:-i * 33.3 - 16, opacity:0, transform:'scale(.1)' }],
          { duration:T(520), easing:'cubic-bezier(.5,0,.75,0)', fill:'both' }));
      }
    }
    // press: a drop squeezes out of the pin, snaps into a ring and bursts; lines and tiny shapes fly out,
    // a halo swells, and three rings swing around it on motion trails. the tooltip rolls to a confirmation.
    const burst = q('.burst'); let braf, rolled = false, rollT;
    function boom(){
      if (!burst || reduce) return;
      const dpr = Math.min(2, devicePixelRatio || 1), W = card.clientWidth, H = card.clientHeight;
      burst.width = W * dpr; burst.height = H * dpr; const c = burst.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cx = P.x, cy = P.y - 35, t0 = performance.now(), PINK = '#E95D8B', NAVY = '#1B2A72';
      const bits = Array.from({ length:16 }, (_, i) => ({ a:i / 16 * Math.PI * 2 + (i % 2) * .15, r:40 + (i * 37 % 26), kind:i % 3, rot:i * .7 }));
      const orbs = [0, 1, 2].map(i => ({ a0:i * 2.094 + .4, r:72 + i * 4 }));
      const ease = k => 1 - Math.pow(1 - Math.max(0, Math.min(1, k)), 3), win = (t, a, b) => (t - a) / (b - a);
      cancelAnimationFrame(braf);
      (function draw(now){
        const t = now - t0; c.clearRect(0, 0, W, H);
        // halo: a soft disc and a hairline circle swelling out
        const hk = win(t, 120, 900); if (hk > 0 && hk < 1){ const e = ease(hk), r = 20 + 74 * e;
          c.globalAlpha = .1 * (1 - hk); c.fillStyle = NAVY; c.beginPath(); c.arc(cx, cy, r * .82, 0, 6.283); c.fill();
