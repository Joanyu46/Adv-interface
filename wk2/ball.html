<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{ --page:#F0F0F2; --ink:#1C1C1E; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--page); font-family:Geist, system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; min-height:520px; padding:20px 0}
.card{position:relative; border-radius:32px; overflow:hidden; width:min(500px, 100vw - 24px); height:200px; box-shadow:0 20px 50px rgba(40,40,80,.12)}
.card svg.art{position:absolute; inset:0; width:100%; height:100%}
.ic{position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; opacity:0; pointer-events:none}
.ic svg{width:24px; height:24px; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.tx{position:absolute; width:0; height:26px; margin-top:-13px; display:flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:-.01em; font-weight:700; color:var(--ink); white-space:nowrap; opacity:0; pointer-events:none; font-variant-numeric:tabular-nums}
.tx svg{flex:none; width:13px; height:13px; fill:var(--ink)}
.tap{all:unset; position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:20px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.tap:focus-visible{outline:2px solid rgba(28,28,30,.35); outline-offset:3px}
.measure{position:absolute; visibility:hidden; white-space:nowrap; font-size:12px; letter-spacing:-.01em; font-weight:700; left:-9999px; top:0}
.measure svg{width:13px; height:13px}
.tap[disabled]{cursor:default}
</style>
</head>
<body>
  <div class="card" id="bar-dot" aria-label="Badge without content"></div>
  <div class="card" id="bar-num" aria-label="Badge with content"></div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const ICON = [
    '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/>',
    '<path d="M7.4 4.2l2 2.6c.4.6.4 1.4-.2 1.9L8 9.8a11 11 0 0 0 6.2 6.2l1.1-1.2c.5-.6 1.3-.6 1.9-.2l2.6 2c.6.5.7 1.3.2 1.9l-.9 1.2c-.6.8-1.6 1.1-2.6.9C10.3 19.4 4.6 13.7 3.4 7.5c-.2-1 .1-2 .9-2.6l1.2-.9c.6-.5 1.4-.4 1.9.2z"/>',
    '<rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l5-3v9l-5-3"/>',
    '<path d="M5 4.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7.5L7 21v-3.5H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M8 10h8M8 13.5h5"/>'
  ];
  const NAMES = ['Email', 'Phone', 'Meeting', 'Chat'];
  const TXT = ['3', 'New', '24', '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.8a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10-7.5 10z"/></svg>'];
  const SAY = ['3 new', 'new', '24 new', 'liked'];
  const B = 64, BR = 20, GAP = 7, SPACE = 44, BIG = 96, BIGR = 30, CY = 108;
  const R = (cx, cy, w, h, r) => ({ x:(cx - w / 2) + 'px', y:(cy - h / 2) + 'px', width:Math.max(0, w) + 'px', height:Math.max(0, h) + 'px', rx:Math.max(0, r ?? Math.min(w, h) / 2) + 'px' });

  function svgDefs(id){
    return `<defs>
      <g id="wp-${id}"><rect x="0" y="0" width="100%" height="100%" fill="#DCDDE2"/>
        <g filter="url(#soft-${id})"><circle cx="12%" cy="20%" r="110" fill="#F1F2F4"/><circle cx="42%" cy="85%" r="120" fill="#C3C6CE"/>
        <circle cx="70%" cy="10%" r="110" fill="#D4D6DC"/><circle cx="95%" cy="80%" r="120" fill="#EEEFF2"/><circle cx="55%" cy="45%" r="70" fill="#B9BCC5"/></g></g>
      <filter id="soft-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
      <filter id="frost-${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="14"/><feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer><feFuncR type="linear" slope="1" intercept=".02"/><feFuncG type="linear" slope="1" intercept=".02"/><feFuncB type="linear" slope="1" intercept=".02"/></feComponentTransfer></filter>
      <filter id="melt-${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4"/>
        <feComponentTransfer><feFuncR type="linear" slope="16" intercept="-7.5"/><feFuncG type="linear" slope="16" intercept="-7.5"/><feFuncB type="linear" slope="16" intercept="-7.5"/></feComponentTransfer></filter>
      <filter id="glass-${id}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="a"/>
        <feSpecularLighting in="a" surfaceScale="5" specularConstant="1.1" specularExponent="30" lighting-color="#fff" result="sp"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
        <feComposite in="sp" in2="SourceAlpha" operator="in" result="sheen"/>
        <feMorphology in="SourceAlpha" operator="erode" radius="1.3" result="er"/><feComposite in="SourceAlpha" in2="er" operator="out" result="edge"/>
        <feFlood flood-color="#fff" flood-opacity=".95"/><feComposite in2="edge" operator="in" result="rim"/>
        <feOffset in="SourceAlpha" dy="5" result="off"/><feGaussianBlur in="off" stdDeviation="6" result="sh"/>
        <feFlood flood-color="#1C1C2A" flood-opacity=".16"/><feComposite in2="sh" operator="in" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="sheen"/><feMergeNode in="rim"/></feMerge></filter>
      <mask id="m-${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><g filter="url(#melt-${id})" class="mg"><rect x="0" y="0" width="100%" height="100%" fill="#000"/></g></mask>
    </defs>
    <use class="wpbg" href="#wp-${id}"/>
    <g filter="url(#glass-${id})"><g mask="url(#m-${id})"><use href="#wp-${id}" filter="url(#frost-${id})"/><rect x="0" y="0" width="100%" height="100%" fill="#fff" fill-opacity=".16"/></g></g>
    <rect class="ol" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="1.8" style="opacity:0"/>`;
  }

  function makeBar(card, kind){
    const id = kind;
    card.innerHTML = `<svg class="art" aria-hidden="true">${svgDefs(id)}</svg>`;
    const svg = card.querySelector('svg'), g = svg.querySelector('.mg'), ol = svg.querySelector('.ol');
    const rect = fill => { const r = document.createElementNS(NS, 'rect'); r.setAttribute('fill', fill); g.appendChild(r); return r; };
    const big = rect('#fff'), tile = [0, 1, 2, 3].map(() => rect('#fff')), cut = [0, 1, 2, 3].map(() => rect('#000')), pill = [0, 1, 2, 3].map(() => rect('#fff'));
    const ic = [], tx = [], tap = [];
    const ms = document.createElement('span'); ms.className = 'measure'; card.appendChild(ms);
    for (let k = 0; k < 4; k++){
      const i = document.createElement('span'); i.className = 'ic'; i.innerHTML = `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`; card.appendChild(i); ic.push(i);
      const t = document.createElement('span'); t.className = 'tx'; if (kind === 'num') t.innerHTML = TXT[k]; card.appendChild(t); tx.push(t);
      const b = document.createElement('button'); b.className = 'tap'; b.disabled = true; b.setAttribute('aria-label', NAMES[k]); b.setAttribute('aria-pressed', 'false'); card.appendChild(b); tap.push(b);
    }
    const st = { intro:[], badge:[[], [], [], []], on:[false, false, false, false] };
    const geo = () => {
      const CX = card.clientWidth / 2, X = [0, 1, 2, 3].map(k => CX + (k - 1.5) * (B + SPACE));
      const D = TXT.map(h => { if (kind === 'dot') return 16; ms.innerHTML = h; return Math.max(26, Math.ceil(ms.getBoundingClientRect().width) + 12); });
      return { CX, X, D };
    };
    // intro: one glass tile drains to an outline, then solid tiles push it along until all four are in place
    function intro(){
      const { CX, X } = geo(), D = 2400, o = { duration:reduce ? 1 : D, fill:'both' }, list = [];
      list.push(big.animate([{ ...R(CX, CY, BIG, BIG, BIGR) }, { offset:.05, ...R(CX, CY, BIG, BIG, BIGR), easing:'cubic-bezier(.5,0,.7,.4)' }, { offset:.17, ...R(CX, CY, 0, 0, 0) }, { ...R(CX, CY, 0, 0, 0) }], o));
      const P = [.3, .46, .62], PUSH = .1;
      const k1 = [{ offset:0, ...R(CX, CY, BIG, BIG, BIGR), opacity:0 }, { offset:.1, ...R(CX, CY, BIG, BIG, BIGR), opacity:1, easing:'cubic-bezier(.65,0,.25,1)' }, { offset:.26, ...R(X[0], CY, B, B, BR), opacity:1 }];
      for (let k = 0; k < 3; k++){ k1.push({ offset:P[k], ...R(X[k], CY, B, B, BR), opacity:1, easing:'cubic-bezier(.6,0,.2,1)' }); k1.push({ offset:P[k] + PUSH, ...R(X[k + 1] + 6, CY, B + 14, B - 6, BR), opacity:1, easing:'cubic-bezier(.3,1.4,.5,1)' }); }
      k1.push({ offset:.82, ...R(X[3], CY, B, B, BR), opacity:1, easing:'ease-in' }, { offset:.92, ...R(X[3], CY, B, B, BR), opacity:0 }, { offset:1, ...R(X[3], CY, B, B, BR), opacity:0 });
      list.push(ol.animate(k1, o));
      tile.forEach((el, k) => {
        const left = X[k] - B / 2, s0 = k < 3 ? P[k] : .8, e0 = k < 3 ? P[k] + PUSH : .9;
        list.push(el.animate(k < 3
          ? [{ ...R(left, CY, 0, B - 8, BR) }, { offset:s0, ...R(left, CY, 0, B - 8, BR), easing:'cubic-bezier(.6,0,.2,1)' }, { offset:e0, ...R(X[k] + 3, CY, B + 6, B - 2, BR), easing:'cubic-bezier(.3,1.4,.5,1)' }, { offset:e0 + .07, ...R(X[k], CY, B, B, BR) }, { ...R(X[k], CY, B, B, BR) }]
          : [{ ...R(X[k], CY, 0, 0, 0) }, { offset:s0, ...R(X[k], CY, 0, 0, 0), easing:'cubic-bezier(.3,1.5,.5,1)' }, { offset:e0, ...R(X[k], CY, B + 6, B + 6, BR) }, { offset:e0 + .05, ...R(X[k], CY, B, B, BR) }, { ...R(X[k], CY, B, B, BR) }], o));
        ic[k].style.left = X[k] + 'px'; ic[k].style.top = CY + 'px'; tap[k].style.left = X[k] + 'px'; tap[k].style.top = CY + 'px';
        const show = k === 0 ? .24 : P[k - 1] + PUSH * .8;
        list.push(ic[k].animate([{ opacity:0, transform:'scale(.6)' }, { offset:show, opacity:0, transform:'scale(.6)', easing:'cubic-bezier(.3,1.5,.5,1)' }, { offset:show + .07, opacity:1, transform:'scale(1)' }, { opacity:1, transform:'scale(1)' }], o));
      });
      list.forEach(a => a.persist());
      return list;
    }
    // badge: a drop leaves the tile for its top-right corner; the tile curves away to make room
    function badge(k){
      const { X, D: Ds } = geo(), Dk = Ds[k], ex = X[k] + B / 2 - (kind === 'dot' ? 6 : 3), ey = CY - B / 2 + (kind === 'dot' ? 6 : 3), inX = X[k] + 6, inY = CY - 6;
      const C = (w) => R(ex, ey, w + GAP * 2, w + GAP * 2), o = { duration:reduce ? 1 : 760, fill:'both' };
      const a = [
        pill[k].animate([{ ...R(inX, inY, 0, 0) }, { offset:.12, ...R(inX, inY, 12, 12), easing:'cubic-bezier(.5,0,.3,1)' },
          { offset:.5, ...R(ex, ey, Dk + 6, Dk + 6), easing:'cubic-bezier(.3,1.4,.5,1)' }, { offset:.78, ...R(ex, ey, Dk - 2, Dk - 2), easing:'ease-out' }, { ...R(ex, ey, Dk, Dk) }], o),
        cut[k].animate([{ ...R(inX, inY, 0, 0) }, { offset:.16, ...R(inX, inY, 0, 0), easing:'cubic-bezier(.5,0,.3,1)' },
          { offset:.5, ...C(Dk + 6), easing:'cubic-bezier(.3,1.4,.5,1)' }, { offset:.78, ...C(Dk - 2), easing:'ease-out' }, { ...C(Dk) }], o)
      ];
      if (kind === 'num'){
        const t = tx[k]; t.style.left = ex + 'px'; t.style.top = ey + 'px';
        a.push(t.animate([{ opacity:0, transform:'scale(.5)', filter:'blur(3px)' }, { offset:.5, opacity:0, transform:'scale(.5)', filter:'blur(3px)', easing:'cubic-bezier(.3,1.6,.5,1)' }, { offset:.86, opacity:1, transform:'scale(1.12)', filter:'blur(0px)' }, { opacity:1, transform:'scale(1)', filter:'blur(0px)' }], o));
      }
      a.forEach(x => x.persist());
      return a;
    }
    function toggle(k, force){
      const on = force ?? !st.on[k]; if (on === st.on[k]) return;
      st.on[k] = on; tap[k].setAttribute('aria-pressed', on);
      tap[k].setAttribute('aria-label', NAMES[k] + (on ? (kind === 'dot' ? ', new activity' : ', ' + SAY[k]) : ''));
      const a = st.badge[k];
      if (a.length && a[0].playState === 'running'){ a.forEach(x => x.reverse()); return; }
      if (!a.length) st.badge[k] = badge(k);
      st.badge[k].forEach(x => { x.playbackRate = on ? 1 : -1.3; x.play(); });
    }
    function relayout(){
      const keep = (list, fresh) => { const t = list.length ? list[0].currentTime : null, r = list.length ? list[0].playbackRate : 1, run = list.length && list[0].playState === 'running';
        list.forEach(x => x.cancel()); const n = fresh(); if (t !== null){ n.forEach(x => { x.currentTime = t; x.playbackRate = r; run ? x.play() : x.pause(); }); } return n; };
      if (st.intro.length) st.intro = keep(st.intro, intro);
      st.badge = st.badge.map((a, k) => a.length ? keep(a, () => badge(k)) : a);
    }
    function start(delay){
      st.intro = intro(); st.intro.forEach(a => a.pause());
      setTimeout(() => { st.intro.forEach(a => a.play()); st.intro[0].finished.then(() => tap.forEach(b => b.disabled = false), () => {}); }, delay);
    }
    tap.forEach((b, k) => b.addEventListener('click', () => toggle(k)));
    return { start, toggle, relayout, st };
  }

  const dot = makeBar(document.getElementById('bar-dot'), 'dot');
  const num = makeBar(document.getElementById('bar-num'), 'num');
  window.__bars = { dot, num };
  addEventListener('resize', () => { dot.relayout(); num.relayout(); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    dot.start(300); num.start(500);
    setTimeout(() => dot.toggle(2, true), reduce ? 0 : 3000);
    setTimeout(() => num.toggle(0, true), reduce ? 0 : 3400);
  });
})();
</script>
</body>
</html>
