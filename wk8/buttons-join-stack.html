<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Buttons</title>
<style>
  :root{
    --ink:#16171a; --muted:#5d6068;
    --h:48px; --r:24px; --rc:8px;          /* Create shape: rounded, with a tighter top-right corner */
    --gap:12px;
    --spring:cubic-bezier(.3,1.25,.5,1);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    display:grid;place-items:center;padding:24px 16px;
    font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;
    background:
      repeating-linear-gradient(118deg,rgba(255,255,255,0) 0 70px,rgba(255,255,255,.22) 110px,rgba(255,255,255,0) 160px,rgba(0,0,0,.05) 230px,rgba(255,255,255,0) 300px),
      linear-gradient(135deg,#b9bbbf 0%,#9a9da2 50%,#8c8f95 100%);
    background-attachment:fixed;
  }

  /* frosted glass card */
  .card{width:min(290px,100%);padding:22px 18px 18px;border-radius:30px;
    background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.10));
    -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.6),0 30px 60px -30px rgba(20,22,30,.45)}
  .card h3{font-size:17px;font-weight:600;padding:0 6px;text-shadow:0 1px 2px rgba(0,0,0,.12)}
  .card p{font-size:14px;color:rgba(255,255,255,.82);line-height:1.45;margin:6px 6px 20px}
  .done{font-size:13px;color:rgba(255,255,255,.8);text-align:center;height:18px;margin-top:14px}

  /* glass materials */
  :root{
    --frost:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14) 60%,rgba(255,255,255,.24));
    --frost-edge:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -8px 14px -6px rgba(255,255,255,.55),0 10px 22px -14px rgba(20,22,30,.45);
    --smoke:radial-gradient(120% 140% at 50% 45%,rgba(28,29,33,.92) 0%,rgba(44,45,50,.86) 55%,rgba(78,80,86,.7) 100%);
    --smoke-edge:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 10px rgba(255,255,255,.08),0 10px 22px -12px rgba(10,12,18,.55);
  }

  /* --- the three actions --- */
  .actions{display:grid;gap:var(--gap);justify-items:center}

  .split{--fg:#fff;
    position:relative;display:flex;width:100%;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:var(--fg);
    transition:transform .45s var(--spring);-webkit-tap-highlight-color:transparent}
  .split .a,.split .b{height:var(--h);display:flex;align-items:center;
    transition:border-radius .5s var(--spring),margin .5s var(--spring),background .25s,box-shadow .25s}
  .split .a{flex:1;padding:0 22px;border-radius:var(--r);font-size:16px;font-weight:500;letter-spacing:-.005em;white-space:nowrap}
  .split .b{width:var(--h);flex:none;justify-content:center;border-radius:var(--r) var(--rc) var(--r) var(--r);margin-left:8px}
  .split .b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .split .a > span,.split .b svg{transition:filter .3s,opacity .3s}
  .split .a,.split .b{-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
  .split .a > span{text-shadow:0 1px 2px rgba(0,0,0,.12)}

  .split:hover .a,.split:focus-visible .a{border-radius:var(--r) 0 0 var(--r)}
  .split:hover .b,.split:focus-visible .b{margin-left:0;border-radius:0 var(--rc) var(--r) 0}
  .split:active{transform:scale(.97)}
  .split:focus-visible{outline:none}

  /* Primary · Save — all smoky glass */
  .split.primary .a,.split.primary .b{background:var(--smoke);box-shadow:var(--smoke-edge)}
  /* Secondary · Confirm — frosted glass, chip included */
  .split.secondary .a,.split.secondary .b{background:var(--frost);box-shadow:var(--frost-edge)}
  /* Tertiary · Cancel — clear glass, lightest */
  .split.tertiary .a,.split.tertiary .b{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 1px 0 rgba(255,255,255,.5)}


  /* seamless join: no inner rims, one continuous tone */
  .split.primary{--rim:rgba(255,255,255,.14)}
  .split.secondary{--rim:rgba(255,255,255,.5)}
  .split.tertiary{--rim:rgba(255,255,255,.45)}
  .split:hover .a,.split:focus-visible .a{box-shadow:inset 1px 0 0 var(--rim),inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim)}
  .split:hover .b,.split:focus-visible .b{box-shadow:inset -1px 0 0 var(--rim),inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim)}
  .split.primary:hover .a,.split.primary:hover .b,.split.primary:focus-visible .a,.split.primary:focus-visible .b{
    background:linear-gradient(180deg,rgba(52,53,58,.9),rgba(30,31,35,.92))}

  /* once the flood has covered the button, hide the two halves underneath → no seam at all */
  .split:hover > .a,.split:hover > .b,.split:focus-visible > .a,.split:focus-visible > .b{
    background:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none;
    transition:border-radius .5s var(--spring),margin .5s var(--spring),background .2s .72s,box-shadow .2s .72s,-webkit-backdrop-filter 0s .72s,backdrop-filter 0s .72s}
  .split:hover > .a > span,.split:hover > .b svg,.split:focus-visible > .a > span,.split:focus-visible > .b svg{opacity:0;transition:opacity .15s .72s}

  /* colour flood: the icon chip's colour sweeps across the button on hover */
  .split .flood{position:absolute;inset:0;display:flex;pointer-events:none;z-index:1;
    border-radius:var(--r) var(--rc) var(--r) var(--r);background:var(--flood);color:var(--flood-fg);
    clip-path:inset(0 0 0 calc(100% - var(--h)) round var(--r) var(--rc) var(--r) var(--r));opacity:0;
    transition:clip-path .45s cubic-bezier(.6,0,.2,1),opacity .2s .38s}
  .split:hover .flood,.split:focus-visible .flood{clip-path:inset(0 0 0 0 round var(--r) var(--rc) var(--r) var(--r));opacity:1;
    transition:clip-path .6s cubic-bezier(.6,0,.2,1) .1s,opacity .15s}
  .split .flood .a,.split .flood .b{background:none!important;box-shadow:none!important;margin-left:0!important;border-radius:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .split .flood .a > span,.split .flood .b svg{filter:none!important;opacity:1!important}
  .split.primary{--flood:var(--frost);--flood-fg:#2a2b30}
  .split.primary .flood .a > span{text-shadow:none}
  .split.secondary{--flood:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.16) 60%,rgba(255,255,255,.22));--flood-fg:#2a2b30}
  .split.secondary .flood .a > span{text-shadow:none}
  .split.tertiary{--flood:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.16) 60%,rgba(255,255,255,.22));--flood-fg:#2a2b30}
  .split.tertiary .flood .a > span{text-shadow:none}
  .split .flood{-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}

  /* icon motion */
  .split:hover .i-arrow,.split:focus-visible .i-arrow{animation:turnIn .6s var(--spring)}
  .split.leaving .i-arrow{animation:turnOut .55s var(--spring)}
  @keyframes turnIn{0%{transform:none}40%{transform:rotate(-45deg)}100%{transform:none}}
  @keyframes turnOut{0%{transform:none}40%{transform:rotate(45deg)}100%{transform:none}}
  .i-check path{stroke-dasharray:20;stroke-dashoffset:0}
  .split:hover .i-check path,.split:focus-visible .i-check path{animation:draw .5s .08s cubic-bezier(.65,0,.35,1) both}
  @keyframes draw{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}
  .split:hover .i-x,.split:focus-visible .i-x{animation:spin .6s var(--spring)}
  .split.leaving .i-x{animation:spinBack .55s var(--spring)}
  @keyframes spin{0%{transform:none}100%{transform:rotate(90deg)}}
  @keyframes spinBack{0%{transform:rotate(90deg)}100%{transform:none}}



  /* hover: diagonal light sweep + jelly wobble */
  .split::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    border-radius:var(--r) var(--rc) var(--r) var(--r);
    background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.06) 55%,transparent 62%);
    background-size:260% 100%;background-position:100% 0;opacity:0;mix-blend-mode:screen}
  .split:hover::after,.split:focus-visible::after{animation:sheen .9s cubic-bezier(.4,0,.2,1) .12s forwards}
  @keyframes sheen{0%{background-position:100% 0;opacity:1}100%{background-position:0% 0;opacity:1}}
  .split.jelly{animation:jelly .7s cubic-bezier(.3,1.2,.5,1)}
  @keyframes jelly{
    0%{transform:none}
    22%{transform:scale(1.035,.93)}
    44%{transform:scale(.985,1.04)}
    66%{transform:scale(1.012,.985)}
    100%{transform:none}}


  /* letter roll on hover (each letter rolls up, a copy rolls in from below) */
  .roll{display:inline-flex;overflow:hidden;height:1.25em;line-height:1.25em;vertical-align:middle}
  .ch{display:inline-flex;flex-direction:column;transition:transform .5s cubic-bezier(.6,0,.2,1.15)}
  .ch i{font-style:normal;display:block;height:1.25em;white-space:pre}
  .split:hover .ch,.split:focus-visible .ch{transform:translateY(-1.25em)}

  /* soft white glow around the button on hover */
  .split::before{content:"";position:absolute;inset:-2px;z-index:-1;pointer-events:none;
    border-radius:calc(var(--r) + 2px) calc(var(--rc) + 2px) calc(var(--r) + 2px) calc(var(--r) + 2px);
    background:rgba(255,255,255,.22);filter:blur(10px);opacity:0;transform:scale(.96);
    transition:opacity .35s var(--ease),transform .5s var(--spring)}
  .split:hover::before,.split:focus-visible::before{opacity:1;transform:scale(1.03)}


  /* light buttons: run the sheen inside the flood, under the text, so the label stays readable */
  .split.secondary::after,.split.tertiary::after{display:none}
  .split.secondary .flood,.split.tertiary .flood{
    background-image:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.3) 48%,rgba(255,255,255,.08) 55%,transparent 62%),var(--flood);
    background-size:260% 100%,100% 100%;background-position:100% 0,0 0;background-repeat:no-repeat}
  .split.secondary:hover .flood,.split.tertiary:hover .flood,.split.secondary:focus-visible .flood,.split.tertiary:focus-visible .flood{
    animation:fsheen 1s cubic-bezier(.4,0,.2,1) .35s forwards}
  @keyframes fsheen{from{background-position:100% 0,0 0}to{background-position:0% 0,0 0}}
  .split.secondary::before,.split.tertiary::before{background:rgba(255,255,255,.14)}


  /* click: squeeze into a dot, then swell back with the new state */
  .split .mblob{position:absolute;top:0;height:var(--h);z-index:4;pointer-events:none;
    border-radius:var(--r) var(--rc) var(--r) var(--r)}
  .split.primary .mblob{background:var(--smoke);box-shadow:var(--smoke-edge)}
  .split.secondary .mblob,.split.tertiary .mblob{background:var(--frost);box-shadow:var(--frost-edge);
    -webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
  .split.morphing{pointer-events:none}
  .split.morphing .a,.split.morphing .b,.split.morphing .flood{opacity:0!important;transition:opacity .15s}
  .split.morphing::after,.split.morphing::before{opacity:0!important}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>

  <div class="card" role="group" aria-labelledby="title">
    <h3 id="title">Save your changes?</h3>
    <p>Your edits to “Top 5 cocktail bars” haven’t been saved yet.</p>

    <div class="actions" id="actions">
        <button class="split primary" data-done="Saved">
          <span class="a"><span>Save</span></span>
          <span class="b"><svg class="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="split secondary" data-done="Confirmed">
          <span class="a"><span>Confirm</span></span>
          <span class="b"><svg class="i-check" viewBox="0 0 24 24"><path pathLength="20" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </button>
        <button class="split tertiary" data-done="Cancelled">
          <span class="a"><span>Cancel</span></span>
          <span class="b"><svg class="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
        </button>
    </div>
    <div class="done" id="done" aria-live="polite"></div>
  </div>

<script>
  const done = document.getElementById('done');
  /* rolling letters */
  const buildRoll = (sp, text) => {
    sp.textContent = '';
    const roll = document.createElement('span'); roll.className = 'roll'; roll.setAttribute('aria-hidden', 'true');
    [...text].forEach((c, i) => {
      const ch = document.createElement('span'); ch.className = 'ch'; ch.style.transitionDelay = (i * 30) + 'ms';
      ch.innerHTML = `<i>${c}</i><i>${c}</i>`; roll.append(ch);
    });
    sp.append(roll);
  };
  const ICONS = {
    arrow:'<svg class="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    check:'<svg class="i-check" viewBox="0 0 24 24"><path pathLength="20" d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x:'<svg class="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };
  document.querySelectorAll('.split').forEach(b => {
    const sp = b.querySelector('.a > span'), text = sp.textContent.trim();
    b.dataset.label = text; b.dataset.icon = b.querySelector('.b svg').getAttribute('class').replace('i-', '');
    b.setAttribute('aria-label', text); buildRoll(sp, text);
  });
  document.querySelectorAll('.split').forEach(b => {
    const f = document.createElement('span'); f.className = 'flood'; f.setAttribute('aria-hidden','true');
    f.append(b.querySelector('.a').cloneNode(true), b.querySelector('.b').cloneNode(true)); b.append(f);
  });
  document.querySelectorAll('.split').forEach(b => {
    b.addEventListener('pointerenter', () => { b.classList.remove('jelly'); void b.offsetWidth; b.classList.add('jelly'); });
    b.addEventListener('animationend', e => { if (e.animationName === 'jelly') b.classList.remove('jelly'); });
    b.addEventListener('pointerleave', () => { b.classList.remove('leaving'); void b.offsetWidth; b.classList.add('leaving'); });
    b.addEventListener('animationend', () => b.classList.remove('leaving'));
    b.addEventListener('click', () => toggleDone(b));
  });
  /* squeeze to a dot → swell back with new content */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const setContent = (b, label, icon) => {
    b.querySelectorAll('.a > span').forEach(sp => buildRoll(sp, label));
    b.querySelectorAll('.b').forEach(bx => { bx.innerHTML = ICONS[icon]; });
    b.setAttribute('aria-label', label);
  };
  const squeeze = (b, label, icon) => new Promise(res => {
    if (reduce) { setContent(b, label, icon); return res(); }
    const W = b.offsetWidth, c = (W - 48) / 2, H = getComputedStyle(b).getPropertyValue('--h');
    const m = document.createElement('span'); m.className = 'mblob'; b.append(m);
    b.classList.add('morphing');
    const full = {left:'0px', width:W + 'px', borderRadius:'24px 8px 24px 24px', transform:'none', filter:'none'};
    const dot  = {left:c + 'px', width:'48px', borderRadius:'24px', transform:'none', filter:'none'};
    const a = m.animate([
      full,
      {...dot, offset:.42},
      {...dot, transform:'scale(1.14)', filter:'brightness(1.35)', offset:.55},
      {...dot, offset:.64},
      full
    ], {duration:1150, easing:'cubic-bezier(.55,0,.25,1)', fill:'forwards'});
    setTimeout(() => setContent(b, label, icon), 640);
    a.finished.then(() => { b.classList.remove('morphing'); setTimeout(() => m.remove(), 160); res(); });
  });
  const DONE = {primary:['Saved','check'], secondary:['Confirmed','check'], tertiary:['Cancelled','x']};
  /* click toggles: original ⇄ done state. Nothing changes until you click that button again. */
  async function toggleDone(b){
    if (b.dataset.busy) return; b.dataset.busy = '1';
    const kind = ['primary','secondary','tertiary'].find(k => b.classList.contains(k));
    if (b.dataset.state === 'done') {
      await squeeze(b, b.dataset.label, b.dataset.icon);
      delete b.dataset.state;
    } else {
      await squeeze(b, ...DONE[kind]);
      b.dataset.state = 'done';
    }
    done.textContent = '';
    delete b.dataset.busy;
  }
</script>
</body>
</html>
